name: Build and deploy CC_Demo

# Merging to master only runs tests (via the PR). Prod deploys when a
# release is published - see "Releasing" in the README.
on:
  pull_request:
    branches: [master, dev]
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/cc-demo

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - run: dotnet restore CC_Demo.sln
      - run: dotnet build CC_Demo.sln --no-restore -c Release
      - run: dotnet test CC_Demo.sln --no-build -c Release

  build-and-push:
    needs: test
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.image.outputs.tag }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A release can target any branch; only ship commits that have
      # already been merged to master.
      - name: Verify release commit is on master
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::Release commit $GITHUB_SHA is not on master"
            exit 1
          fi

      - id: image
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: CC_Demo/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.image.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.image.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  terraform-apply:
    needs: build-and-push
    runs-on: ubuntu-latest
    # Two releases published close together must not apply at the same time.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    defaults:
      run:
        working-directory: terraform
    env:
      # Cloudflare R2 credentials for the Terraform remote state backend
      # (backend.tf) - not the same as CLOUDFLARE_API_TOKEN below.
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      TF_VAR_render_api_key: ${{ secrets.RENDER_API_KEY }}
      TF_VAR_render_owner_id: ${{ secrets.RENDER_OWNER_ID }}
      TF_VAR_neon_api_key: ${{ secrets.NEON_API_KEY }}
      TF_VAR_neon_org_id: ${{ secrets.NEON_ORG_ID }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      TF_VAR_image_repository: ghcr.io/${{ github.repository_owner }}/cc-demo
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - run: terraform init
      - run: terraform apply -auto-approve

      # render_web_service is pinned to the "latest" tag on purpose (see the
      # comment in render.tf) - `terraform apply` above only provisions
      # infra, it never tells Render to pull the image that build-and-push
      # just pushed. Trigger that redeploy explicitly instead, via the
      # service's deploy hook (Render dashboard > cc-demo-api > Settings >
      # Deploy Hook), which sidesteps the buggy Terraform update path
      # entirely.
      - name: Trigger Render deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
