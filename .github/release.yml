# Groups auto-generated release notes (gh release create --generate-notes)
# by PR label. A PR appears only under the first category it matches, so
# order matters. Unlabeled PRs land in "Other changes".
changelog:
  exclude:
    labels:
      - release   # the master <- dev release PR itself
      - duplicate
      - invalid
      - wontfix
      - question
  categories:
    - title: Features
      labels:
        - enhancement
    - title: Bug fixes
      labels:
        - bug
    - title: Accessibility
      labels:
        - accessibility
    - title: Documentation
      labels:
        - documentation
    - title: Other changes
      labels:
        - "*"
